name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            zip

      - name: Build
        shell: msys2 {0}
        run: ./build.sh

      - name: Smoke test
        shell: msys2 {0}
        run: ./bin/PowerGuard.exe --version

      - name: Package
        shell: msys2 {0}
        run: bash scripts/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PowerGuard-win64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PowerGuard-win64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
