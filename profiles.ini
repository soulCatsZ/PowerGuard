# ============================================================
# PowerGuard 分游戏参数
#
# 段名 = 进程名（不含 .exe，大小写不敏感）
#   [bg3_dx11] 匹配 bg3_dx11.exe
# 没写的键沿用命令行 / profile 的默认值。
# [default] 对所有目标生效；游戏自己的段覆盖 [default]。
#
# 可用键（和命令行参数同名）：
#   control_gpu = 0 / control_cpu = 0   关闭对应杠杆 (或 no_gpu = 1 / no_cpu = 1)
#   gpu_limit / min_gpu / max_gpu
#   cpu_max / cpu_min / cpu_step / cpu_power_step
#   prefer = cpu|gpu|auto （降档先动哪个杠杆，默认 gpu；
#                          auto = 按近期 CPU/GPU 功率占比自动选）
#   gpu_clock / min_gpu_clock / clock_step / auto_clock / gpu_clock_auto
#   gpu_clock_pct / min_gpu_clock_pct / auto_clock_pct
#     按 GPU 最大核心频率的百分比换算 MHz，换机器时优先用这三个
#   budget             （可选）预算模式: CPU+GPU 合计超过该瓦数就降档,
#                       不需要电池信号, 适合台式机/电池不可用的机器
#   battery_threshold / deficit_energy / deficit_window / step_cooldown
#   step / hold_down / hold_up
#
# 这些值只是"起点"：运行时的电池负反馈仍会继续升降档。
# 保存后 1~2 秒自动重新加载；游戏运行中修改会先恢复旧限制，再套用新值。
# 键名/值写错不会生效：日志里会提示行号，也可用 --check-profiles 单独校验。
# ============================================================

[default]
# 所有游戏通用的保守参数，示例：
# battery_threshold = 2.0
# deficit_energy = 0.10
# step_cooldown = 15

# 换机器时先跑 PowerGuard.exe --diagnose，再用百分比写起点，例如：
# gpu_clock_pct = 50
# min_gpu_clock_pct = 30
# auto_clock_pct = 45

# 没有电池（台式机）或电池信号不可用时，用预算模式：
# budget = 80        # CPU+GPU 合计预算, 按电源功率与固定开销估算

# ---- 博德之门3 ----
# 实测：GPU 锁 1400MHz 时缺口约 10W；降到 800MHz + CPU 84% 才稳住。
# 这里给一个偏保守的起点，让闭环自己微调。
[bg3_dx11]
gpu_clock = 900
cpu_max = 89
prefer = cpu

# 旧版启动器（有的版本主进程叫 bg3.exe）
[bg3]
gpu_clock = 900
cpu_max = 89
prefer = cpu

# ---- 影之刃零 (Phantom Blade Zero) ----
# 第一次实测（旧电池读数）把充电脉冲误判成 11~12W 缺口，1300 的结论作废。
# 改用电池类驱动后，先用 1400 作为起点重新观察；真实缺口出现时闭环保守降档。
[pbz]
gpu_clock = 1400
cpu_max = 99
prefer = gpu

# ---- 星空 ----
# 实测 1400MHz / CPU 99% 时 GPU 约 26W、电池 0W，不需要额外降档。
# [starfield]
# gpu_clock = 1400
# cpu_max = 99
